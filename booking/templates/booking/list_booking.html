{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Bookings</h2>
    <a href="{% url 'booking:create_booking' %}" class="btn btn-primary">Add New Booking</a>
</div>
<form method="get" class="input-group mb-3">
    <input type="text" name="q" class="form-control" value="{{ query }}" placeholder="Search...">
    <button class="btn btn-outline-secondary" type="submit">Search</button>
</form>
<table class="table table-striped table-hover bg-white shadow-sm">
    <thead class="table-dark">
        <tr><th>ID / Details</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for obj in page_obj %}
        <tr>
            <td>{{ obj }}</td>
            <td>
                <form action="{% url 'booking:delete_booking' obj.pk %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2" class="text-center">No records found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
