<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Flight Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'booking:dashboard' %}">✈️ FlightManager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'booking:list_airline' %}">Airlines</a>
                <a class="nav-link" href="{% url 'booking:list_airplane' %}">Airplanes</a>
                <a class="nav-link" href="{% url 'booking:list_airport' %}">Airports</a>
                <a class="nav-link" href="{% url 'booking:list_flight' %}">Flights</a>
                <a class="nav-link" href="{% url 'booking:list_seat' %}">Seats</a>
                <a class="nav-link" href="{% url 'booking:list_person' %}">Passengers</a>
                <a class="nav-link" href="{% url 'booking:list_booking' %}">Bookings</a>
                <form action="{% url 'logout' %}" method="post" class="d-inline ms-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm mt-1">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
