{% extends 'base.html' %}
{% block content %}
<div class="card shadow p-4 mx-auto text-center" style="max-width: 500px;">
    <h3>Confirm Delete</h3>
    <p class="my-3">Are you sure you want to delete: <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Yes, Delete</button>
    </form>
    <a href="{% url 'booking:list_flight' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
</div>
{% endblock %}
